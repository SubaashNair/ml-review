[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-review"
version = "0.4.0"
description = "MLReview model evaluation, inspection, diagnostics, and reporting for scikit-learn estimators"
readme = "README.md"
authors = [
    {name = "Subashanan Nair", email = "subashnair12@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.9.0",
    "matplotlib>=3.5.0"
]

[project.optional-dependencies]
shap = [
    "shap>=0.44,<0.50; python_version < '3.11'",
    "shap>=0.50; python_version >= '3.11'",
]

[project.urls]
"Homepage" = "https://github.com/SubaashNair/ml-review"
"Bug Tracker" = "https://github.com/SubaashNair/ml-review/issues"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:datetime\\.datetime\\.utcfromtimestamp\\(\\) is deprecated.*:DeprecationWarning:dateutil\\.tz\\.tz",
]
